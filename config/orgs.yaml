# Org Registry
# Full list documented in docs/ORGS.md
# Add entries here; run: repo-hub fetch --org HANDLE to pull immediately.

defaults:
  min_stars: 10
  include_forks: false
  osi_only: true          # OSI-approved licenses only
  inactive_days: 365
  cache_ttl_hours: 24
  max_repos_per_org: 500
  dep_scrape_min_stars: 50   # only scrape dep files for repos above this

