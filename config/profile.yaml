# User Interest Profile
# Edit domain_weights to tune what scores high for you.
# 0.0 = exclude entirely  |  1.0 = neutral  |  3.0 = highest boost

profile:
  name: "OS · AI · FPGA · GPU · Inference"

  domain_weights:
    os_kernel:          2.5
    drivers_firmware:   2.5
    desktop_open:       2.0   # KDE/GNOME/Wayland work
    android_device:     1.5
    fpga:               2.8
    cpu_inference:      2.5
    gpu_runtime:        2.8
    ai_compiler:        2.8
    quantization:       2.5
    llm_inference:      2.0
    ml_training:        1.5
    hf_ecosystem:       1.8
    hw_abstraction:     2.5
    profiling:          2.0
    databases:          1.2
    browser_wasm:       1.5
    agentic:            1.0
    observability:      2.0

  # Tech nodes you actively use or closely follow — these boost S_profile
  tech_interests:
    - mlir
    - triton
    - iree
    - rocm
    - cuda
    - sycl
    - onnxruntime
    - openvino
    - ebpf
    - mesa
    - wayland
    - vllm
    - llama.cpp
    - gptq
    - awq

  preferred_languages:
    - C++
    - Python
    - Rust
    - C

  # Orgs you consider highest-priority (small additive bonus)
  priority_orgs:
    - openxla
    - iree-org
    - intel
    - ROCm
    - tenstorrent
    - triton-lang
    - llvm
    - mesa3d
    - KDE
    - torvalds

  # Composite weight overrides (must sum to 1.0)
  scoring_weights:
    W_activity:  0.20
    W_ontology:  0.30
    W_deps:      0.20
    W_profile:   0.30
