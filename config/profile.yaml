# User Interest Profile
# Edit domain_weights to tune what scores high for you.
# 0.0 = exclude entirely  |  1.0 = neutral  |  3.0 = highest boost

profile:
  name: "OS · AI · FPGA · GPU · Inference · EDA · PCIe · RISC-V"

  domain_weights:
    # ── Hardware Foundation ──────────────────────────────────────────
    os_kernel:          2.5   # Linux kernel, eBPF, io_uring, DPDK
    drivers_firmware:   2.5   # Mesa, EDK2, Zephyr, device drivers
    desktop_open:       2.0   # KDE/GNOME/Wayland — SuryaOS work
    android_device:     1.5   # Android HAL, postmarketOS
    fpga:               3.0   # FPGA inference, Alveo, Vitis HLS
    eda_sim:            2.8   # Yosys, Verilator, cocotb, GHDL, Calyx
    interconnect:       2.8   # PCIe, CXL, NVMe, RDMA, SPDK
    soc_riscv:          2.5   # Chipyard, CVA6, Rocket, LiteX, OpenTitan

    # ── Compute Engines ──────────────────────────────────────────────
    cpu_inference:      2.5   # SIMD, AMX, ARM SVE, oneDNN
    gpu_runtime:        3.0   # CUDA, ROCm, HIP, SYCL
    ai_compiler:        3.0   # MLIR, IREE, Triton, TVM, CIRCT

    # ── AI/ML Stack ──────────────────────────────────────────────────
    quantization:       2.5   # GPTQ, AWQ, INT8/INT4, pruning
    llm_inference:      2.2   # vLLM, llama.cpp, TRT-LLM
    ml_training:        1.5   # PyTorch, JAX, DeepSpeed
    hf_ecosystem:       1.8   # Transformers, Diffusers, PEFT
    hw_abstraction:     2.5   # ONNX Runtime, OpenVINO, QNN

    # ── Infrastructure ───────────────────────────────────────────────
    profiling:          2.2   # MLPerf, NSight, VTune, perf
    databases:          1.2   # Vector DBs, DuckDB (lower priority)
    browser_wasm:       1.5   # WebGPU, WebNN, Wasmtime
    agentic:            1.0   # LangChain, AutoGen (context only)
    observability:      2.2   # OTel, MLflow, eBPF tracing — OCT project

  # Tech nodes you actively use or closely follow — boost S_profile
  tech_interests:
    # Compilers
    - mlir
    - circt
    - iree
    - triton
    - tvm
    # Hardware / FPGA
    - rocm
    - cuda
    - sycl
    - litex
    - verilator
    - cocotb
    - yosys
    # Inference
    - onnxruntime
    - openvino
    - vllm
    - llama.cpp
    # Interconnect
    - spdk
    - rdma
    - pcie
    - libfabric
    # Systems
    - ebpf
    - mesa
    - wayland
    # Quantization
    - gptq
    - awq

  preferred_languages:
    - C++
    - Python
    - Rust
    - C
    - Scala       # Chisel/FIRRTL

  # Orgs you consider highest-priority — small additive bonus to S_profile
  priority_orgs:
    - openxla
    - iree-org
    - llvm            # CIRCT lives here
    - triton-lang
    - intel
    - ROCm
    - tenstorrent
    - mesa3d
    - KDE
    - torvalds
    - YosysHQ
    - cocotb
    - chipsalliance
    - enjoy-digital
    - spdk

  # Composite weight overrides (must sum to 1.0)
  scoring_weights:
    W_activity:  0.20
    W_ontology:  0.30
    W_deps:      0.20
    W_profile:   0.30
