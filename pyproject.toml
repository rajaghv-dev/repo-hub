[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-hub"
version = "0.1.0"
description = "Second brain for GitHub repositories across 21 technical domains"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx[http2]>=0.27",
    "rich>=13.7",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "google-cloud-storage>=2.16",
    "pyarrow>=16.0",
    "huggingface_hub>=0.23",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
repo-hub = "repo_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
